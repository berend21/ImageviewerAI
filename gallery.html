<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0a0a0a">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <title>Photos</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header>
        <div class="logo">📷 <span>Photos</span></div>
        
        <div class="search-container">
            <input type="text" class="search" id="search" placeholder="Search..." autocomplete="off">
            <button class="search-clear" id="searchClear" type="button">✕</button>
        </div>
        
        <div class="toolbar">
            <button class="btn" id="rescan" title="Scan for new photos">
                <span>↻</span><span>Scan</span>
            </button>
            <span class="stats" id="stats"></span>
        </div>
    </header>
    
    <main>
        <div class="gallery-toolbar">
            <div class="view-controls">
                <button class="view-btn active" id="gridSquare"
                        type="button" aria-pressed="true">
                    Square
                </button>
                <button class="view-btn" id="gridOriginal"
                        type="button" aria-pressed="false">
                    Original ratio
                </button>
                <button class="view-btn" id="gridCompact"
                        type="button" aria-pressed="false">
                    Compact
                </button>
            </div>

            <button class="view-btn" id="selectMode"
                    type="button" aria-pressed="false">
                Select
            </button>
        </div>

        <div class="selection-toolbar" id="selectionToolbar"
            hidden>
            <span id="selectionCount">0 selected</span>
            <div>
                <button class="view-btn" id="openSelected" type="button">
                    Open first
                </button>
                <button class="view-btn" id="clearSelection" type="button">
                    Clear
                </button>
                <button class="view-btn" id="exitSelection" type="button">
                    Done
                </button>
            </div>
        </div>

            <div class="empty" id="empty">
        <div class="empty-icon">📷</div>
        <div class="empty-text">No photos found</div>
    </div>

    <div class="gallery" id="gallery"></div>

    <div class="loading" id="loading">
        <div class="spinner"></div>
    </div>

    <div id="sentinel" aria-hidden="true"></div>
    </main>
    
    <div class="lightbox" id="lightbox">
        <div class="lb-header">
            <button class="lb-btn" id="lbClose" title="Close">✕</button>
            <span class="lb-title" id="lbTitle"></span>
            <button class="lb-btn danger" id="lbDelete" title="Delete">🗑</button>
            <button class="lb-btn" id="lbInfo" title="Info">ℹ</button>
        </div>
        
        <button class="lb-nav prev" id="lbPrev">‹</button>
        <button class="lb-nav next" id="lbNext">›</button>
        
        <div class="lb-content" id="lbContent">
            <div class="lb-spinner" id="lbSpinner"></div>
            <img id="lbImg" draggable="false" alt="">
        </div>
        
        <div class="lb-footer">
            <span id="lbCounter"></span>
            <span id="lbDims"></span>
        </div>
        
        <div class="info-panel" id="infoPanel">
            <div class="info-header">
                <h3>Details</h3>
                <button class="lb-btn" id="infoClose">✕</button>
            </div>
            <div class="info-content" id="infoContent"></div>
        </div>
    </div>
    
    <div class="modal-overlay" id="deleteModal">
        <div class="modal">
            <div class="modal-icon">🗑️</div>
            <h3>Delete Photo?</h3>
            <div class="modal-filename" id="deleteFilename"></div>
            <p>This will permanently delete the file from your computer.</p>
            <div class="modal-actions">
                <button class="btn" id="deleteCancel">Cancel</button>
                <button class="btn danger-solid" id="deleteConfirm">Delete</button>
            </div>
        </div>
    </div>
    
    <div class="toast-container" id="toastContainer"></div>
    
    <button class="scroll-top" id="scrollTop">↑</button>

<script>
const PER_PAGE = 100;
const state = {
    photos: [],
    page: 1,
    total: 0,
    loading: false,
    hasMore: true,
    search: '',
    idx: 0,
    infoPanelOpen: false,
    deleteTarget: null,
    selectionMode: false,
    selectedIds: new Set(),
    layout: 'square',
    zoom: 1,
    panX: 0,
    panY: 0,
    dragging: false,
    dragStartX: 0,
    dragStartY: 0,
    dragOriginX: 0,
    dragOriginY: 0
};
let searchRequestId = 0;

const $ = id => document.getElementById(id);

function formatDate(iso) {
    if (!iso) return null;
    const d = new Date(iso);
    if (isNaN(d.getTime())) return null;
    return d.toLocaleDateString(undefined, { 
        year: 'numeric', month: 'short', day: 'numeric',
        hour: '2-digit', minute: '2-digit'
    });
}

function formatSize(bytes) {
    if (!bytes) return '';
    if (bytes > 1024 * 1024) return (bytes / 1024 / 1024).toFixed(1) + ' MB';
    return (bytes / 1024).toFixed(0) + ' KB';
}

function debounce(fn, delay) {
    let timer;
    return (...args) => {
        clearTimeout(timer);
        timer = setTimeout(() => fn(...args), delay);
    };
}

function showToast(message, type = 'info') {
    const toast = document.createElement('div');
    toast.className = 'toast ' + type;
    toast.textContent = message;
    $('toastContainer').appendChild(toast);
    setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transition = 'opacity 0.3s';
        setTimeout(() => toast.remove(), 300);
    }, 2500);
}

async function fetchJson(url, options = {}) {
    const method = (options.method || 'GET').toUpperCase();
    const headers = new Headers(options.headers || {});

    if (!['GET', 'HEAD', 'OPTIONS'].includes(method)) {
        const token = document.querySelector(
            'meta[name="csrf-token"]'
        )?.content;

        if (!token) {
            throw new Error('CSRF token is missing. Reload the page.');
        }

        headers.set('X-CSRFToken', token);
    }

    const response = await fetch(url, {
        ...options,
        method,
        headers,
        credentials: 'same-origin'
    });

    // fetch() resolves normally for HTTP errors, so check explicitly.
    if (!response.ok) {
        let message = `Request failed (${response.status})`;

        try {
            const body = await response.json();
            if (typeof body.error === 'string' && body.error) {
                message = body.error;
            }
        } catch {
            // Keep the HTTP status message if the body isn't JSON.
        }

        throw new Error(message);
    }

    return response.json();
}

async function fetchPhotos(page, search = '') {
    const params = new URLSearchParams({
        page: String(page),
        per_page: String(PER_PAGE),
        search
    });

    return fetchJson('/api/photos?' + params);
}

async function fetchDetail(id) {
    return fetchJson('/api/photo/' + encodeURIComponent(id));
}

async function fetchStats() {
    return fetchJson('/api/stats');
}

async function deletePhoto(id) {
    return fetchJson('/api/photo/' + encodeURIComponent(id), {
        method: 'DELETE'
    });
}

function createPhotoEl(p) {
    const div = document.createElement('div');
    div.className = 'photo';
    div.dataset.id = p.id;
    div.setAttribute('aria-label', p.filename || 'Photo');

    if (p.dominant_color) {
        div.style.backgroundColor = p.dominant_color;
    }

    if (state.selectedIds.has(p.id)) {
        div.classList.add('selected');
    }

    if (state.layout === 'original' && p.width > 0 && p.height > 0) {
        div.style.aspectRatio = `${p.width} / ${p.height}`;
    }

    const img = document.createElement('img');
    img.loading = 'lazy';
    img.decoding = 'async';
    img.src = '/thumbnail/' + p.id;
    img.alt = p.filename || '';

    img.onload = () => img.classList.add('loaded');
    img.onerror = () => {
        div.style.backgroundColor = '#2a2a2a';
    };

    div.appendChild(img);

    if (p.has_tags) {
        const badge = document.createElement('span');
        badge.className = 'badge';
        badge.textContent = 'AI';
        div.appendChild(badge);
    }

    if (state.selectedIds.has(p.id)) {
        const check = document.createElement('span');
        check.className = 'selection-check';
        check.textContent = '✓';
        check.setAttribute('aria-hidden', 'true');
        div.appendChild(check);
    }

    return div;
}

function formatGroupDate(date) {
    if (date === 'Unknown date') return date;

    const parsed = new Date(date + 'T12:00:00');

    return Number.isNaN(parsed.getTime())
        ? date
        : parsed.toLocaleDateString(undefined, {
            weekday: 'short',
            year: 'numeric',
            month: 'short',
            day: 'numeric'
        });
}

function getRowCapacity() {
    return window.innerWidth <= 600 ? 4 : 8;
}
function render(photos, append = false) {
    const gallery = $('gallery');

    // Keep previously loaded photos when another page is appended.
    const allPhotos = append
        ? [...state.photos, ...photos]
        : [...photos];

    // Rebuild the layout so shared rows remain correct across pages.
    state.photos = allPhotos;

    const savedScrollY = window.scrollY;
    gallery.replaceChildren();
    gallery.dataset.layout = state.layout;
    gallery.classList.toggle('selection-mode', state.selectionMode);

    const capacity = getRowCapacity();
    gallery.style.setProperty('--row-columns', capacity);

    // Group consecutive photos by date.
    const groups = [];

    for (const p of allPhotos) {
        const date = p.date_group || 'Unknown date';
        let group = groups[groups.length - 1];

        if (!group || group.date !== date) {
            group = { date, photos: [] };
            groups.push(group);
        }

        group.photos.push(p);
    }

    const frag = document.createDocumentFragment();
    let pending = [];
    let pendingCount = 0;

    function makeHeading(date) {
        const heading = document.createElement('div');
        heading.className = 'date-heading';
        heading.textContent = formatGroupDate(date);
        return heading;
    }

    function addPhotos(container, group) {
        for (const p of group.photos) {
            container.appendChild(createPhotoEl(p));
        }
    }

    function flushPending() {
        if (!pending.length) return;

        const section = document.createElement('section');
        section.className = 'day-section shared-days';

        const row = document.createElement('div');
        row.className = 'shared-photo-row';
        row.style.setProperty('--row-columns', capacity);

        for (const group of pending) {
            const day = document.createElement('div');
            day.className = 'shared-day';
            day.style.gridColumn = `span ${group.photos.length}`;

            day.appendChild(makeHeading(group.date));

            const images = document.createElement('div');
            images.className = 'shared-day-photos';
            images.style.gridTemplateColumns =
                `repeat(${group.photos.length}, minmax(0, 1fr))`;

            addPhotos(images, group);
            day.appendChild(images);
            row.appendChild(day);
        }

        section.appendChild(row);
        frag.appendChild(section);

        pending = [];
        pendingCount = 0;
    }

    function renderIsolatedDay(group) {
        const section = document.createElement('section');
        section.className = 'day-section';
        section.dataset.date = group.date;

        section.appendChild(makeHeading(group.date));

        const grid = document.createElement('div');
        grid.className = 'day-photos';
        grid.style.setProperty('--row-columns', capacity);

        addPhotos(grid, group);

        section.appendChild(grid);
        frag.appendChild(section);
    }

    for (const group of groups) {
        const count = group.photos.length;

        // A full-row day or larger owns its rows completely.
        if (count >= capacity) {
            flushPending();
            renderIsolatedDay(group);
            continue;
        }

        // Never split a date between rows.
        if (pendingCount + count > capacity) {
            flushPending();
        }

        pending.push(group);
        pendingCount += count;

        // A completely filled row is closed immediately.
        if (pendingCount === capacity) {
            flushPending();
        }
    }

    flushPending();
    gallery.appendChild(frag);

    $('empty').classList.toggle(
        'active',
        state.photos.length === 0
    );

    updateSelectionUI();
    if (append) {
        requestAnimationFrame(() => {
        window.scrollTo(0, savedScrollY);
    });
}
}

function updateSelectionUI() {
    const count = state.selectedIds.size;

    $('selectionToolbar').hidden = !state.selectionMode;
    $('selectionCount').textContent = `${count} selected`;

    $('selectMode').classList.toggle('active', state.selectionMode);
    $('selectMode').setAttribute(
        'aria-pressed',
        String(state.selectionMode)
    );

    $('gallery').classList.toggle(
        'selection-mode',
        state.selectionMode
    );
}

function setSelectionMode(enabled) {
    state.selectionMode = enabled;

    if (!enabled) {
        state.selectedIds.clear();
    }

    render(state.photos.slice());
    renderGalleryLayout();
    updateSelectionUI();
}

function renderGalleryLayout() {
    const gallery = $('gallery');
    gallery.dataset.layout = state.layout;

    $('gridSquare').classList.toggle(
        'active',
        state.layout === 'square'
    );
    $('gridOriginal').classList.toggle(
        'active',
        state.layout === 'original'
    );
    $('gridCompact').classList.toggle(
        'active',
        state.layout === 'compact'
    );

    for (const [id, value] of [
        ['gridSquare', 'square'],
        ['gridOriginal', 'original'],
        ['gridCompact', 'compact']
    ]) {
        $(id).setAttribute(
            'aria-pressed',
            String(state.layout === value)
        );
    }

    gallery.querySelectorAll('.photo').forEach(el => {
        const p = state.photos.find(
            photo => photo.id === Number(el.dataset.id)
        );

        if (!p) return;

        if (state.layout === 'original') {
            el.style.aspectRatio =
                p.width > 0 && p.height > 0
                    ? `${p.width} / ${p.height}`
                    : 'auto';
        } else {
            el.style.aspectRatio = '1 / 1';
        }
    });
}

$('selectMode').addEventListener('click', () => {
    setSelectionMode(!state.selectionMode);
});

$('clearSelection').addEventListener('click', () => {
    state.selectedIds.clear();
    setSelectionMode(true);
});

$('exitSelection').addEventListener('click', () => {
    setSelectionMode(false);
});

$('openSelected').addEventListener('click', () => {
    const idx = state.photos.findIndex(
        p => state.selectedIds.has(p.id)
    );

    if (idx >= 0) {
        const photo = $('gallery').querySelector(
            `[data-id="${state.photos[idx].id}"]`
        );
        setSelectionMode(false);
        openLb(idx);
    }
});

$('gridSquare').addEventListener('click', () => {
    state.layout = 'square';
    renderGalleryLayout();
});

$('gridOriginal').addEventListener('click', () => {
    state.layout = 'original';
    renderGalleryLayout();
});

$('gridCompact').addEventListener('click', () => {
    state.layout = 'compact';
    renderGalleryLayout();
});

function removePhotoFromGallery(id) {
    const el = $('gallery').querySelector(`[data-id="${id}"]`);
    if (el) {
        el.style.transition = 'transform 0.2s, opacity 0.2s';
        el.style.transform = 'scale(0.8)';
        el.style.opacity = '0';
        setTimeout(() => el.remove(), 200);
    }
    state.photos = state.photos.filter(p => p.id !== id);
}

async function loadMore() {
    if (state.loading || !state.hasMore) return;

    const requestId = searchRequestId;

    state.loading = true;
    $('loading').classList.add('active');

    const nextPage = state.page + 1;

    try {
        const data = await fetchPhotos(nextPage, state.search);
        if (requestId !== searchRequestId) return;
        const photos = data.photos || [];
        const existingIds = new Set(state.photos.map(p => p.id));
        const newPhotos = photos.filter(p => !existingIds.has(p.id));

        if (photos.length === 0) {
            state.hasMore = false;
        } else {
            state.page = nextPage;

            if (newPhotos.length > 0) {
                render(newPhotos, true);
            }

            state.hasMore = state.photos.length < data.total;
        }
    } catch (e) {
        console.error('Load error:', e);
        showToast('Failed to load more photos', 'error');
    } finally {
        if (requestId === searchRequestId) {
            state.loading = false;
            $('loading').classList.remove('active');
        }
    }
}

const doSearch = debounce(async (q) => {
    const requestId = ++searchRequestId;

    state.search = q.trim();
    state.page = 1;
    state.hasMore = true;
    state.loading = true;

    $('loading').classList.add('active');

    try {
        const data = await fetchPhotos(1, state.search);

        if (requestId !== searchRequestId) return;

        state.total = data.total || 0;
        state.hasMore =
            (data.photos?.length || 0) < state.total;

        render(data.photos || []);
    } catch (e) {
        if (requestId !== searchRequestId) return;

        console.error('Search error:', e);
        showToast('Search failed', 'error');
        render([]);
    } finally {
        if (requestId === searchRequestId) {
            state.loading = false;
            $('loading').classList.remove('active');
        }
    }

    updateStats();
}, 300);

async function updateStats() {
    try {
        const s = await fetchStats();
        const stats = $('stats');
        stats.replaceChildren();

        const total = document.createElement('span');
        total.textContent =
            `${Number(s.total) || 0} photos`;
        stats.appendChild(total);

        if (Number(s.with_tags) > 0) {
            const highlight = document.createElement('span');
            highlight.className = 'highlight';
            highlight.textContent = `${Number(s.with_tags)} AI`;

            stats.append(' · ', highlight);
        }
    } catch (e) {
        console.error('Stats error:', e);
    }
}

function openLb(idx) {
    state.idx = idx;
    state.infoPanelOpen = false;

    $('infoPanel').classList.remove('active');
    $('lightbox').classList.add('active');
    document.body.style.overflow = 'hidden';

    loadLbImg();
}

function closeLb() {
    $('lightbox').classList.remove('active');
    $('infoPanel').classList.remove('active');
    state.infoPanelOpen = false;
    document.body.style.overflow = '';
}

function loadLbImg(sourceEl = null) {
    const p = state.photos[state.idx];
    if (!p) return;

    const lbImg = $('lbImg');
    const lbSpinner = $('lbSpinner');

    resetZoom();

    lbImg.style.display = 'none';
    lbImg.style.opacity = '1';
    lbSpinner.style.display = 'block';

    $('lbTitle').textContent = p.filename || '';
    $('lbCounter').textContent =
        `${state.idx + 1} / ${state.photos.length}`;
    $('lbDims').textContent = '';

    $('lbPrev').disabled = state.idx === 0;
    $('lbNext').disabled =
        state.idx >= state.photos.length - 1;

    const img = new Image();

    img.onload = () => {

        if (state.photos[state.idx]?.id !== p.id) return;

        lbImg.src = img.src;
        lbImg.style.display = 'block';
        lbSpinner.style.display = 'none';

        $('lbDims').textContent =
            `${img.naturalWidth} × ${img.naturalHeight}`;
        lbImg.style.opacity = '1';
        
    };

    img.onerror = () => {
        if (state.photos[state.idx]?.id !== p.id) return;

        lbSpinner.style.display = 'none';
        lbImg.style.display = 'none';
        $('lbDims').textContent = 'Failed to load';
        showToast('Failed to load photo', 'error');
    };

    img.src = '/image/' + encodeURIComponent(p.id);

    if (state.idx + 1 < state.photos.length) {
        new Image().src =
            '/image/' + encodeURIComponent(
                state.photos[state.idx + 1].id
            );
    }

    if (state.idx > 0) {
        new Image().src =
            '/image/' + encodeURIComponent(
                state.photos[state.idx - 1].id
            );
    }
}

function navLb(dir) {
    const newIdx = state.idx + dir;
    if (newIdx >= 0 && newIdx < state.photos.length) {
        state.idx = newIdx;
        loadLbImg();
    }
}

function addInfoRow(container, label, value, options = {}) {
    const row = document.createElement('div');
    row.className = 'info-row';

    const labelEl = document.createElement('div');
    labelEl.className = 'info-label';
    labelEl.textContent = label;

    const valueEl = document.createElement('div');
    valueEl.className = 'info-value';

    if (options.valueClass) {
        valueEl.classList.add(options.valueClass);
    }

    if (options.preformatted) {
        valueEl.style.maxHeight = '80px';
        valueEl.style.overflow = 'auto';
        valueEl.style.backgroundColor = 'var(--bg)';
        valueEl.style.padding = '8px';
        valueEl.style.borderRadius = '6px';
        valueEl.style.fontSize = '12px';
    }

    valueEl.textContent = value == null ? '' : String(value);

    row.append(labelEl, valueEl);
    container.appendChild(row);
}

function addTagRow(container, label, values) {
    const tags = Object.keys(values || {});
    if (!tags.length) return;

    const row = document.createElement('div');
    row.className = 'info-row';

    const labelEl = document.createElement('div');
    labelEl.className = 'info-label';
    labelEl.textContent = label;

    const valueEl = document.createElement('div');
    valueEl.className = 'info-value';

    for (const tag of tags) {
        const span = document.createElement('span');
        span.className = 'tag';
        span.textContent = tag;
        valueEl.appendChild(span);
    }

    row.append(labelEl, valueEl);
    container.appendChild(row);
}

async function loadInfoPanel() {
    const p = state.photos[state.idx];
    if (!p) return;

    const content = $('infoContent');
    content.replaceChildren();

    const spinner = document.createElement('div');
    spinner.className = 'spinner';
    spinner.style.margin = '40px auto';
    content.appendChild(spinner);

    try {
        const d = await fetchDetail(p.id);

        if (
            !state.infoPanelOpen ||
            state.photos[state.idx]?.id !== p.id
        ) {
            return;
        }

        content.replaceChildren();

        addInfoRow(content, 'Filename', d.filename);

        const dateTaken = formatDate(d.exif_date);
        const fileModified = formatDate(d.file_modified);

        if (dateTaken) {
            addInfoRow(content, 'Date Taken', dateTaken);
        }

        if (fileModified && fileModified !== dateTaken) {
            addInfoRow(content, 'File Modified', fileModified, {
                valueClass: 'muted'
            });
        }

        if (d.exif_camera) {
            addInfoRow(content, 'Camera', d.exif_camera);
        }

        addInfoRow(
            content,
            'Dimensions',
            `${d.width ?? '?'} × ${d.height ?? '?'}`
        );

        addInfoRow(content, 'Size', formatSize(d.file_size));

        if (
            Number.isFinite(d.gps?.lat) &&
            Number.isFinite(d.gps?.lon)
        ) {
            const row = document.createElement('div');
            row.className = 'info-row';

            const label = document.createElement('div');
            label.className = 'info-label';
            label.textContent = 'Location';

            const value = document.createElement('div');
            value.className = 'info-value';

            const lat = d.gps.lat;
            const lon = d.gps.lon;

            const link = document.createElement('a');
            const params = new URLSearchParams({
                q: `${lat},${lon}`
            });

            link.href = `https://maps.google.com/?${params}`;
            link.target = '_blank';
            link.rel = 'noopener noreferrer';
            link.textContent =
                `${lat.toFixed(5)}, ${lon.toFixed(5)} ↗`;

            value.appendChild(link);
            row.append(label, value);
            content.appendChild(row);
        }

        if (d.caption || d.tags || d.categories || d.ocr_text) {
            const separator = document.createElement('div');
            separator.style.marginTop = '20px';
            separator.style.paddingTop = '16px';
            separator.style.borderTop = '1px solid var(--border)';
            content.appendChild(separator);

            if (d.caption) {
                addInfoRow(content, 'Caption', d.caption);
            }

            addTagRow(content, 'Tags', d.tags);
            addTagRow(content, 'Categories', d.categories);

            if (d.ocr_text) {
                addInfoRow(content, 'Text (OCR)', d.ocr_text, {
                    preformatted: true
                });
            }
        }

        const path = document.createElement('div');
        path.className = 'info-path';
        path.textContent = d.filepath || '';
        content.appendChild(path);

    } catch (e) {
        if (
            !state.infoPanelOpen ||
            state.photos[state.idx]?.id !== p.id
        ) {
            return;
        }

        content.replaceChildren();

        const error = document.createElement('div');
        error.style.color = 'var(--danger)';
        error.style.padding = '20px';
        error.textContent = 'Failed to load details';
        content.appendChild(error);

        console.error('Details error:', e);
    }
}

function showInfo() {
    state.infoPanelOpen = true;
    $('infoPanel').classList.add('active');
    loadInfoPanel();
}

function hideInfo() {
    state.infoPanelOpen = false;
    $('infoPanel').classList.remove('active');
}

function showDeleteModal() {
    const p = state.photos[state.idx];
    if (!p) return;
    
    state.deleteTarget = p;
    $('deleteFilename').textContent = p.filename;
    $('deleteModal').classList.add('active');
}

function hideDeleteModal() {
    state.deleteTarget = null;
    $('deleteModal').classList.remove('active');
}

function confirmDelete() { 
    if (!state.deleteTarget) return;

    hideDeleteModal();

    showToast('Deletion is currently disabled', 'info'); }

async function rescan() {
    const btn = $('rescan');
    btn.disabled = true;

    try {
        const result = await fetchJson('/api/rescan', {
            method: 'POST'
        });

        if (result.success !== true) {
            throw new Error(result.error || 'Scan failed');
        }

        showToast('Scan complete', 'success');
        await updateStats();
        await doSearch(state.search);

    } catch (e) {
        console.error('Rescan error:', e);
        showToast(e.message || 'Scan failed', 'error');
    } finally {
        btn.disabled = false;
    }
}

const observer = new IntersectionObserver(entries => {
    const entry = entries[0];

    if (
        entry.isIntersecting &&
        !state.loading &&
        state.hasMore
    ) {
        loadMore();
    }
}, {
    rootMargin: '200px 0px',
    threshold: 0
});

observer.observe($('sentinel'));

let scrollTicking = false;
window.addEventListener('scroll', () => {
    if (!scrollTicking) {
        requestAnimationFrame(() => {
            $('scrollTop').classList.toggle('visible', window.scrollY > 400);
            scrollTicking = false;
        });
        scrollTicking = true;
    }
}, { passive: true });

$('gallery').addEventListener('click', e => {
    const photo = e.target.closest('.photo');
    if (!photo) return;

    const id = Number(photo.dataset.id);
    const idx = state.photos.findIndex(p => p.id === id);
    if (idx < 0) return;

    if (state.selectionMode) {
        if (state.selectedIds.has(id)) {
            state.selectedIds.delete(id);
        } else {
            state.selectedIds.add(id);
        }

        photo.classList.toggle(
            'selected',
            state.selectedIds.has(id)
        );

        const check = photo.querySelector('.selection-check');

        if (state.selectedIds.has(id) && !check) {
            const mark = document.createElement('span');
            mark.className = 'selection-check';
            mark.textContent = '✓';
            mark.setAttribute('aria-hidden', 'true');
            photo.appendChild(mark);
        } else if (!state.selectedIds.has(id) && check) {
            check.remove();
        }

        updateSelectionUI();
        return;
    }

    openLb(idx, photo);
});

$('search').addEventListener('input', e => {searchRequestId++; doSearch(e.target.value);});
$('searchClear').addEventListener('click', () => {
    $('search').value = '';
    doSearch('');
    $('search').focus();
});

$('rescan').addEventListener('click', rescan);
$('lbClose').addEventListener('click', closeLb);
$('lbPrev').addEventListener('click', () => navLb(-1));
$('lbNext').addEventListener('click', () => navLb(1));
$('lbInfo').addEventListener('click', () => state.infoPanelOpen ? hideInfo() : showInfo());
$('lbDelete').addEventListener('click', showDeleteModal);
$('infoClose').addEventListener('click', hideInfo);
$('scrollTop').addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));

$('deleteCancel').addEventListener('click', hideDeleteModal);
$('deleteConfirm').addEventListener('click', confirmDelete);
$('deleteModal').addEventListener('click', e => {
    if (e.target === $('deleteModal')) hideDeleteModal();
});

$('lbContent').addEventListener('click', e => {
    if (e.target === $('lbContent')) closeLb();
});

document.addEventListener('keydown', e => {
    if ($('deleteModal').classList.contains('active')) {
        if (e.key === 'Escape') hideDeleteModal();
        else if (e.key === 'Enter') confirmDelete();
        return;
    }
    
    if ($('lightbox').classList.contains('active')) {
        if (e.key === 'Escape') {
            if (state.infoPanelOpen) hideInfo();
            else closeLb();
        }
        else if (e.key === 'ArrowLeft') navLb(-1);
        else if (e.key === 'ArrowRight') navLb(1);
        else if (e.key === 'i') {
            state.infoPanelOpen ? hideInfo() : showInfo();
        }
        else if (e.key === 'Delete' || e.key === 'Backspace') {
            e.preventDefault();
            showDeleteModal();
        }
        return;
    }
    
    if (e.key === '/' && !e.ctrlKey && !e.metaKey) {
        e.preventDefault();
        $('search').focus();
    }
});

let touchStartX = 0;
let touchStartY = 0;
let touchMoved = false;

$('lbContent').addEventListener('touchstart', e => {
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
    touchMoved = false;
}, { passive: true });

$('lbContent').addEventListener('touchmove', e => {
    touchMoved = true;
}, { passive: true });

$('lbContent').addEventListener('touchend', e => {
    if (!touchMoved) return;
    
    const dx = touchStartX - e.changedTouches[0].clientX;
    const dy = touchStartY - e.changedTouches[0].clientY;
    
    if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 60) {
        navLb(dx > 0 ? 1 : -1);
    }
}, { passive: true });

const lbContent = $('lbContent');
const lbImg = $('lbImg');

const MIN_ZOOM = 1;
const MAX_ZOOM = 5;
const ZOOM_STEP = 1.15;

function applyZoom() {
    lbImg.style.transform =
        `translate(${state.panX}px, ${state.panY}px) scale(${state.zoom})`;

    lbImg.classList.toggle('zoomed', state.zoom > MIN_ZOOM);
    lbImg.classList.toggle('dragging', state.dragging);
}

function resetZoom() {
    state.zoom = 1;
    state.panX = 0;
    state.panY = 0;
    state.dragging = false;
    lbImg.style.transform = '';
    lbImg.classList.remove('zoomed', 'dragging');
}

lbContent.addEventListener('wheel', e => {
    if (!$('lightbox').classList.contains('active')) return;

    e.preventDefault();

    const oldZoom = state.zoom || 1;
    const factor = e.deltaY < 0 ? ZOOM_STEP : 1 / ZOOM_STEP;
    const newZoom = Math.min(
        MAX_ZOOM,
        Math.max(MIN_ZOOM, oldZoom * factor)
    );

    if (newZoom === oldZoom) return;

    // Pointer position relative to the image container's center.
    const rect = lbContent.getBoundingClientRect();
    const pointerX = e.clientX - rect.left - rect.width / 2;
    const pointerY = e.clientY - rect.top - rect.height / 2;

    // Keep the point beneath the pointer stationary while zooming.
    state.panX = pointerX - (pointerX - state.panX) * (newZoom / oldZoom);
    state.panY = pointerY - (pointerY - state.panY) * (newZoom / oldZoom);
    state.zoom = newZoom;

    if (state.zoom === MIN_ZOOM) {
        state.panX = 0;
        state.panY = 0;
    }

    applyZoom();
}, { passive: false });

// Drag the image while zoomed in.
lbImg.addEventListener('pointerdown', e => {
    if (state.zoom <= MIN_ZOOM || e.button !== 0) return;

    e.preventDefault();

    state.dragging = true;
    state.dragStartX = e.clientX;
    state.dragStartY = e.clientY;
    state.dragOriginX = state.panX;
    state.dragOriginY = state.panY;

    lbImg.setPointerCapture(e.pointerId);
    applyZoom();
});

lbImg.addEventListener('pointermove', e => {
    if (!state.dragging) return;

    state.panX = state.dragOriginX + e.clientX - state.dragStartX;
    state.panY = state.dragOriginY + e.clientY - state.dragStartY;

    applyZoom();
});

function stopDragging() {
    if (!state.dragging) return;
    state.dragging = false;
    applyZoom();
}

lbImg.addEventListener('pointerup', stopDragging);
lbImg.addEventListener('pointercancel', stopDragging);
lbImg.addEventListener('lostpointercapture', stopDragging);

(async () => {
    console.log('[Photos] Initializing gallery');

    try {
        console.time('[Photos] Initial API request');
        const data = await fetchPhotos(1);
        console.timeEnd('[Photos] Initial API request')

        console.log('[Photos] API response:', data);

        state.total = data.total || 0;
        state.hasMore =
            (data.photos?.length || 0) < state.total;

        render(data.photos || []);

        console.log('[Photos] Rendered:', data.photos?.length || 0);

        await updateStats();
    } catch (e) {
        console.error('[Photos] Initialization failed:', e);
        $('empty').classList.add('active');
        showToast('Failed to load photos: ' + e.message, 'error');
    }
})();
